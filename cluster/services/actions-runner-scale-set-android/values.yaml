githubConfigUrl: "https://github.com/recomendapp/app"
githubConfigSecret: arc-github-app-credentials

# The chart normally auto-discovers the controller's ServiceAccount via a
# Helm `lookup()` against the live cluster. ArgoCD renders via `helm template`
# (no live cluster access at render time), so lookup() returns nothing and
# the chart errors out unless this is set explicitly. Name follows the
# controller's release name from cluster/services/actions-runner-controller
# (releaseName: arc-controller -> <releaseName>-gha-rs-controller).
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller

minRunners: 0
maxRunners: 3

runnerScaleSetName: infra-android-heavy

template:
  metadata:
    annotations:
      # cluster-autoscaler killed the underlying Hetzner VM mid-job once
      # (node "does not exist in the cloud provider" while a job was
      # actively running on it), which the runner reported as "lost
      # communication with the server". This stops the autoscaler from
      # ever considering a node unneeded while this pod is running on it.
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
  spec:
    # Dedicated CX43 pool (hetzner/cluster_config.yaml: large-android) —
    # keeps this pricier/bigger node type from ever being used for anything
    # but this runner, and vice versa (nothing else can land on it).
    nodeSelector:
      nodepool: large-android
    tolerations:
      - key: dedicated
        value: android-runner
        effect: NoSchedule
    imagePullSecrets:
      - name: github-credentials
    containers:
      - name: runner
        image: ghcr.io/recomendapp/runner-android:sha-05c4dc9
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "false"
          # Same recipe EAS Build's own "medium" cloud workers use (confirmed
          # via docs.expo.dev/build-reference/infrastructure): GRADLE_OPTS
          # overrides gradle.properties' org.gradle.jvmargs, so this works
          # regardless of what expo prebuild regenerates in android/.
          # org.gradle.daemon=false is the important bit: our OOM
          # ("RMI TCP Connection(idle)" OutOfMemoryError: Metaspace) was
          # thrown by the Gradle daemon's own idle-monitor thread — with the
          # daemon disabled that failure mode can't happen at all.
          - name: GRADLE_OPTS
            value: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
        resources:
          requests:
            cpu: "6"
            memory: 12Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: "7"
            memory: 14Gi
            ephemeral-storage: 40Gi
