githubConfigUrl: "https://github.com/recomendapp/app"
githubConfigSecret: arc-github-app-credentials

# The chart normally auto-discovers the controller's ServiceAccount via a
# Helm `lookup()` against the live cluster. ArgoCD renders via `helm template`
# (no live cluster access at render time), so lookup() returns nothing and
# the chart errors out unless this is set explicitly. Name follows the
# controller's release name from cluster/services/actions-runner-controller
# (releaseName: arc-controller -> <releaseName>-gha-rs-controller).
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller

minRunners: 0
maxRunners: 3

runnerScaleSetName: infra-android-heavy

listenerTemplate:
  spec:
    nodeSelector:
      kubernetes.io/hostname: recomend-pool-small-static-worker1
    containers:
      - name: listener

template:
  metadata:
    annotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
  spec:
    nodeSelector:
      nodepool: large-android
    tolerations:
      - key: dedicated
        value: android-runner
        effect: NoSchedule
    imagePullSecrets:
      - name: github-credentials
    containers:
      - name: runner
        image: ghcr.io/recomendapp/runner-android:sha-9246d51
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "false"
          - name: GRADLE_OPTS
            value: "-Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx2048m,-XX:MaxMetaspaceSize=512m\" -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4"
        resources:
          requests:
            cpu: "6"
            memory: 12Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: "7"
            memory: 14Gi
            ephemeral-storage: 40Gi
