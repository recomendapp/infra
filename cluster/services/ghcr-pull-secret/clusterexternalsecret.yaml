apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: github-credentials
spec:
  externalSecretName: github-credentials
  refreshTime: 1h
  # Selected by the kubernetes.io/metadata.name label Kubernetes sets on
  # every namespace, so adding a namespace here needs no label on it.
  namespaceSelectors:
    - matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - backend
            - default
            - arc-runners
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: infisical
    target:
      name: github-credentials
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: |
            {
              "auths": {
                "ghcr.io": {
                  "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
                }
              }
            }
    data:
      - secretKey: username
        remoteRef:
          key: GITHUB_USERNAME
      - secretKey: token
        remoteRef:
          key: GITHUB_TOKEN
