apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  project: default
  sources:
    - repoURL: 'https://prometheus-community.github.io/helm-charts'
      chart: kube-prometheus-stack
      targetRevision: 79.7.1
      helm:
        valuesObject:
          grafana:
            enabled: false

          alertmanager:
            enabled: false

          kubeStateMetrics:
            enabled: false

          nodeExporter:
            enabled: false

          defaultRules:
            create: false

          # pvc-autoresizer reads kubelet_volume_stats_* from this target;
          # disabling it silently stops PVC auto-resize.
          kubelet:
            enabled: true
          kubeApiServer:
            enabled: false
          kubeControllerManager:
            enabled: false
          kubeScheduler:
            enabled: false
          kubeProxy:
            enabled: false
          kubeEtcd:
            enabled: false
          coreDns:
            enabled: false

          prometheus:
            prometheusSpec:
              retention: 2d
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    storageClassName: hcloud-volumes
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        # A StatefulSet volumeClaimTemplate is immutable and a
                        # Hetzner volume cannot shrink: a lower value fails the
                        # sync. Reclaiming it needs a delete-and-recreate.
                        storage: 20Gi

    - repoURL: https://github.com/recomendapp/infra.git
      targetRevision: main
      path: cluster/services/monitoring
      directory:
        recurse: true

  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
