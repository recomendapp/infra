apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ghcr-pull-secret
  namespace: argocd
  annotations:
    # Ahead of actions-runner-scale-set-android (16) and apps-root (100),
    # both of which run workloads that list this Secret.
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/recomendapp/infra.git
    targetRevision: main
    path: cluster/services/ghcr-pull-secret
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
