apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-webhook-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    # argocd-secret already exists -- it's created and otherwise owned by the
    # argo-cd Helm chart (admin password, TLS certs, ...). Merge just adds/
    # updates this one key instead of taking ownership of the whole secret.
    name: argocd-secret
    creationPolicy: Merge
    template:
      data:
        # Key name ArgoCD itself looks for to validate the GitHub webhook
        # payload signature -- see
        # https://argo-cd.readthedocs.io/en/stable/operator-manual/webhook/
        webhook.github.secret: "{{ .webhookSecret }}"

  data:
    - secretKey: webhookSecret
      remoteRef:
        key: ARGOCD_WEBHOOK_SECRET
