# One-off data migration: copies every existing object from the live MinIO
# StatefulSet to the live RustFS StatefulSet, bucket by bucket. NOT part of
# kustomization.yaml on purpose — this must only run once, by hand, during the
# cutover window described in the migration runbook, while both `minio` and
# `rustfs` Services are reachable in-cluster at the same time.
#
# Usage:
#   kubectl apply -n backend -f apps/services/backend/rustfs/migrate-job.yaml
#   kubectl logs -n backend job/rustfs-migrate -f
#   kubectl delete -n backend -f apps/services/backend/rustfs/migrate-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-migrate
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mc
          image: quay.io/minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: S3_SECRET_ACCESS_KEY
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: S3_BUCKET
            - name: S3_SITEMAPS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: S3_SITEMAPS_BUCKET
            - name: S3_IMPORTS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: S3_IMPORTS_BUCKET
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "Configuring aliases..."
              mc alias set miniosrc http://minio:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
              mc alias set rustfsdst http://rustfs:9000 "${S3_ACCESS_KEY_ID}" "${S3_SECRET_ACCESS_KEY}"

              for bucket in "${S3_BUCKET}" "${S3_SITEMAPS_BUCKET}" "${S3_IMPORTS_BUCKET}"; do
                echo "=== Mirroring bucket ${bucket}: miniosrc -> rustfsdst ==="
                if mc ls "miniosrc/${bucket}" > /dev/null 2>&1; then
                  mc mirror --overwrite "miniosrc/${bucket}" "rustfsdst/${bucket}"
                else
                  echo "Bucket ${bucket} does not exist on MinIO, skipping."
                fi
              done

              echo "=== Verifying object counts ==="
              for bucket in "${S3_BUCKET}" "${S3_SITEMAPS_BUCKET}" "${S3_IMPORTS_BUCKET}"; do
                src_count=$(mc ls --recursive "miniosrc/${bucket}" 2>/dev/null | wc -l)
                dst_count=$(mc ls --recursive "rustfsdst/${bucket}" 2>/dev/null | wc -l)
                echo "${bucket}: minio=${src_count} rustfs=${dst_count}"
                if [ "${src_count}" != "${dst_count}" ]; then
                  echo "MISMATCH on ${bucket} — investigate before cutting over."
                  exit 1
                fi
              done

              echo "Migration complete, object counts match on every bucket."
