apiVersion: batch/v1
kind: Job
metadata:
  name: assets-sync
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      imagePullSecrets:
        - name: github-credentials
      containers:
        - name: assets-sync
          # TODO(rustfs-migration): bump this tag once the app repo's RustFS
          # prep PR is merged and CD has rebuilt — this pinned tag's entrypoint
          # still defaults S3_ENDPOINT to minio:9000, not rustfs:9000.
          image: ghcr.io/recomendapp/assets:b96-8de3dd5
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: rustfs-secret
      restartPolicy: Never
  backoffLimit: 4
