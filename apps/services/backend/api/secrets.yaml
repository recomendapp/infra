apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: api-secret
    creationPolicy: Owner
  data:
    - secretKey: AUTH_COOKIE_DOMAIN
      remoteRef:
        key: AUTH_COOKIE_DOMAIN
    - secretKey: AUTH_SECRET
      remoteRef:
        key: AUTH_SECRET
    # Google
    - secretKey: AUTH_GOOGLE_CLIENT_ID
      remoteRef:
        key: AUTH_GOOGLE_CLIENT_ID
    - secretKey: AUTH_GOOGLE_IOS_CLIENT_ID
      remoteRef:
        key: AUTH_GOOGLE_IOS_CLIENT_ID
    - secretKey: AUTH_GOOGLE_ANDROID_CLIENT_ID
      remoteRef:
        key: AUTH_GOOGLE_ANDROID_CLIENT_ID
    - secretKey: AUTH_GOOGLE_CLIENT_SECRET
      remoteRef:
        key: AUTH_GOOGLE_CLIENT_SECRET
    # Github
    - secretKey: AUTH_GITHUB_CLIENT_ID
      remoteRef:
        key: AUTH_GITHUB_CLIENT_ID
    - secretKey: AUTH_GITHUB_CLIENT_SECRET
      remoteRef:
        key: AUTH_GITHUB_CLIENT_SECRET
    # Facebook
    - secretKey: AUTH_FACEBOOK_CLIENT_ID
      remoteRef:
        key: AUTH_FACEBOOK_CLIENT_ID
    - secretKey: AUTH_FACEBOOK_CLIENT_SECRET
      remoteRef:
        key: AUTH_FACEBOOK_CLIENT_SECRET
    # Apple
    - secretKey: AUTH_APPLE_CLIENT_ID
      remoteRef:
        key: AUTH_APPLE_CLIENT_ID
    - secretKey: AUTH_APPLE_TEAM_ID
      remoteRef:
        key: AUTH_APPLE_TEAM_ID
    - secretKey: AUTH_APPLE_KEY_ID
      remoteRef:
        key: AUTH_APPLE_KEY_ID
    - secretKey: AUTH_APPLE_PRIVATE_KEY
      remoteRef:
        key: AUTH_APPLE_PRIVATE_KEY
    - secretKey: AUTH_APPLE_BUNDLE_ID
      remoteRef:
        key: AUTH_APPLE_BUNDLE_ID
    # RevenueCat
    - secretKey: REVENUECAT_API_KEY
      remoteRef:
        key: REVENUECAT_API_KEY
    - secretKey: REVENUECAT_WEBHOOK_SECRET
      remoteRef:
        key: REVENUECAT_WEBHOOK_SECRET
    # Imports/exports — same Prefect basic-auth credential the server itself and the worker use
    # (see apps/applications/prefect.yaml's `existingSecret: prefect-auth-secret`), plus the
    # shared secret validated by InternalImportsGuard for the Prefect -> API webhook.
    - secretKey: PREFECT_API_AUTH_STRING
      remoteRef:
        key: PREFECT_AUTH_STRING
    - secretKey: API_INTERNAL_IMPORTS_SECRET
      remoteRef:
        key: API_INTERNAL_IMPORTS_SECRET