apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  tls:
    - hosts:
        - medias.recomend.app
      secretName: minio-tls
  rules:
    - host: medias.recomend.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # RustFS cutover: kept in minio/ so the existing minio-tls cert
                # is reused; moves to rustfs/ when minio/ is removed.
                name: rustfs
                port:
                  number: 9000