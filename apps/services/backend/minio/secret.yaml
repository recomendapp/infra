apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: minio-secret
    creationPolicy: Owner
  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: S3_ACCESS_KEY_ID
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: S3_SECRET_ACCESS_KEY
    - secretKey: S3_BUCKET
      remoteRef:
        key: S3_BUCKET