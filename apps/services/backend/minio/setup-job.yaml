apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      containers:
      - name: mc
        # MinIO no longer distributes mc images (Docker Hub removed, quay.io
        # now 401). This is a PostSync hook — it runs on every ArgoCD sync of
        # the backend app, so a dead image here blocks every future deploy.
        # Chainguard's build is maintained; -dev ships the shell. Pinned by digest.
        image: cgr.dev/chainguard/minio-client@sha256:f0dd93b48af1f8a641edcd3c64661c8dbe05189bd2ef2f8cea216eb18af10bf8
        envFrom:
          - secretRef:
              name: minio-secret
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for MinIO to be reachable..."
          until mc alias set myminio http://minio:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"; do
            echo "MinIO not reachable yet, retrying in 2s..."
            sleep 2;
          done;

          echo "MinIO is ready. Configuring bucket..."
          
          if ! mc ls myminio/${S3_BUCKET} > /dev/null 2>&1; then
            echo "Creating bucket ${S3_BUCKET}..."
            mc mb myminio/${S3_BUCKET}
            mc anonymous set download myminio/${S3_BUCKET}
            echo "Bucket ${S3_BUCKET} created and set to public read."
          else
            echo "Bucket ${S3_BUCKET} already exists."
          fi

          if ! mc ls myminio/${S3_SITEMAPS_BUCKET} > /dev/null 2>&1; then
            echo "Creating bucket ${S3_SITEMAPS_BUCKET}..."
            mc mb myminio/${S3_SITEMAPS_BUCKET}
            mc anonymous set download myminio/${S3_SITEMAPS_BUCKET}
            echo "Bucket ${S3_SITEMAPS_BUCKET} created and set to public read."
          else
            echo "Bucket ${S3_SITEMAPS_BUCKET} already exists."
          fi

          if ! mc ls myminio/${S3_IMPORTS_BUCKET} > /dev/null 2>&1; then
            echo "Creating bucket ${S3_IMPORTS_BUCKET}..."
            mc mb myminio/${S3_IMPORTS_BUCKET}
            echo "Bucket ${S3_IMPORTS_BUCKET} created (private — no anonymous access, holds user import/export files)."
          else
            echo "Bucket ${S3_IMPORTS_BUCKET} already exists."
          fi
      restartPolicy: Never