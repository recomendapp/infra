apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-backup
spec:
  schedule: "0 4 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: minio-mirror
              # MinIO no longer distributes mc images (Docker Hub removed,
              # quay.io now 401). Chainguard's build is maintained; -dev ships
              # the shell this script needs. Pinned by digest.
              image: cgr.dev/chainguard/minio-client@sha256:f0dd93b48af1f8a641edcd3c64661c8dbe05189bd2ef2f8cea216eb18af10bf8
              env:
                - name: LOCAL_MINIO_USER
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: MINIO_ROOT_USER
                - name: LOCAL_MINIO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: MINIO_ROOT_PASSWORD
                
                - name: R2_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-r2-secret
                      key: AWS_ACCESS_KEY_ID
                - name: R2_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-r2-secret
                      key: AWS_SECRET_ACCESS_KEY
                - name: R2_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: minio-r2-secret
                      key: S3_BUCKET
                - name: R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: minio-r2-secret
                      key: S3_ENDPOINT

              command:
                - /bin/sh
                - -c
                - |
                  # mc mirror exits 0 even when an alias failed to register
                  # (it then mirrors nothing), so fail on any step instead.
                  set -eu
                  echo "⏳ Starting MinIO Mirror to Cloudflare R2..."

                  mc alias set local http://minio:9000 "$LOCAL_MINIO_USER" "$LOCAL_MINIO_PASSWORD"
                  mc alias set backup "$R2_ENDPOINT" "$R2_ACCESS_KEY" "$R2_SECRET_KEY"

                  mc mirror --overwrite local/ backup/"$R2_BUCKET"/minio-data/

                  echo "✅ MinIO mirror successful!"