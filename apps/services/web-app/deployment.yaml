apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      imagePullSecrets:
        - name: github-credentials
      containers:
        - name: web-app
          image: ghcr.io/recomendapp/web-app:20251212201351
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 5
            successThreshold: 1
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # env:
          #   - name: NODE_OPTIONS
          #     value: "--dns-result-order=ipv4first"
          envFrom:
            - secretRef:
                name: web-app-secret
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache

        - name: cache-cleaner
          image: alpine
          command: ["sh", "-c", "while true; do find /cache -type f -mtime +1 -delete; sleep 3600; done"]
          volumeMounts:
            - name: cache
              mountPath: /cache
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

      volumes:
        - name: cache
          emptyDir:
            sizeLimit: "20Gi"
