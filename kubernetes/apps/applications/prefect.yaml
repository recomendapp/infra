apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prefect
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://prefecthq.github.io/prefect-helm
      chart: prefect-server
      targetRevision: 2025.11.21180339
      helm:
        valuesObject:
          server:
            replicaCount: 1

            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 1Gi
            
            basicAuth:
              enabled: true
              existingSecret: "prefect-auth-secret"
            
            uiConfig:
              prefectUiApiUrl: "https://prefect.recomend.app/api"
            
            env:
              - name: PREFECT_SERVER_API_CSRF_PROTECTION_ENABLED
                value: "true"

          postgresql:
            enabled: true
            primary:
              resources:
                requests:
                  cpu: "100m"
                  memory: "1536Mi"
                limits:
                  cpu: "1"
                  memory: "2Gi"
              persistence:
                enabled: true
                storageClass: longhorn
                # 32,6 Gi réellement utilisés contre 10Gi déclarés :
                # pvc-autoresizer avait poussé le volume Hetzner à 44Gi.
                # C'est presque tout de l'historique de flow runs, et le
                # CronJob history-prune ne suit visiblement pas. À purger
                # avant la copie, ce qui permettrait de redescendre ici.
                size: 50Gi
                annotations:

    - repoURL: https://prefecthq.github.io/prefect-helm
      chart: prefect-worker
      targetRevision: 2025.11.21180339
      helm:
        valuesObject:
          worker:
            apiConfig: selfHostedServer
            config:
              workPool: kube
              baseJobTemplate:
                existingConfigMapName: prefect-base-job-template
              
            selfHostedServerApiConfig:
              apiUrl: "http://prefect-server.prefect.svc.cluster.local:4200/api"

              basicAuth:
                enabled: true
                existingSecret: "prefect-auth-secret"

    - repoURL: https://github.com/recomendapp/infra.git
      targetRevision: vcluster
      path: kubernetes/apps/services/prefect
      directory:
        recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: prefect

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
