apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: martin
spec:
  ingressClassName: traefik
  rules:
    - host: martin.recomend.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: martin
                port:
                  number: 80
