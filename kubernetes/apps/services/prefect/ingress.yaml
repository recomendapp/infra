apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prefect
  namespace: prefect
  annotations:
    external-dns.kubernetes.io/target: eaa1365e-4fbc-4be3-b071-595fc95e7506.cfargotunnel.com
spec:
  ingressClassName: traefik
  rules:
    - host: prefect.recomend.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prefect-server
                port:
                  number: 4200
