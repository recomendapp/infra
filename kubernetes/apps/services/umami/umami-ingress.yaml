apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: umami
spec:
  ingressClassName: traefik
  rules:
    - host: analytics.recomend.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: umami
                port:
                  number: 3000
