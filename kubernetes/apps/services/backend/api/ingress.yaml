apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    # Without this external-dns takes Traefik's published endpoint and writes
    # an in-cluster DNS name into a public zone. Note the prefix: NOT
    # `external-dns.alpha.kubernetes.io/`, which v0.23 ignores silently.
    external-dns.kubernetes.io/target: eaa1365e-4fbc-4be3-b071-595fc95e7506.cfargotunnel.com
spec:
  ingressClassName: traefik
  rules:
    - host: api.recomend.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
