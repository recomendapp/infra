apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  annotations:
    # Après le Deployment qu'il cible (wave 3). Sans ça l'HPA part en wave 0,
    # le contrôleur répond `deployments.apps "api" not found`, ArgoCD tient
    # l'HPA pour non sain et ne quitte jamais la wave 0 : l'api, notify,
    # worker et postgres ne sont jamais déployés. Invisible sur un cluster
    # où le Deployment existe déjà — c'est un bug de premier démarrage.
    argocd.argoproj.io/sync-wave: "4"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 1
  maxReplicas: 4
  # scaleUp takes the minimum recommendation over its window, so a spike
  # shorter than 300s never adds a pod - only sustained load does.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180
  metrics:
  # CPU only: memory here is a flat per-pod baseline, so a memory target
  # makes scale-up irreversible and minReplicas unreachable.
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70