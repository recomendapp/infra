apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs
spec:
  ingressClassName: traefik
  rules:
    - host: medias.recomend.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rustfs
                port:
                  number: 9000
