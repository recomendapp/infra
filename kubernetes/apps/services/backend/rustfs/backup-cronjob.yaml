apiVersion: batch/v1
kind: CronJob
metadata:
  name: rustfs-backup
spec:
  schedule: "0 4 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rustfs-mirror
              image: rustfs/rc@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
              env:
                - name: LOCAL_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-secret
                      key: S3_ACCESS_KEY_ID
                - name: LOCAL_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-secret
                      key: S3_SECRET_ACCESS_KEY
                - name: LOCAL_S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-secret
                      key: S3_BUCKET
                - name: LOCAL_S3_SITEMAPS_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-secret
                      key: S3_SITEMAPS_BUCKET
                - name: LOCAL_S3_IMPORTS_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-secret
                      key: S3_IMPORTS_BUCKET

                - name: R2_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-r2-secret
                      key: AWS_ACCESS_KEY_ID
                - name: R2_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-r2-secret
                      key: AWS_SECRET_ACCESS_KEY
                - name: R2_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-r2-secret
                      key: S3_BUCKET
                - name: R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-r2-secret
                      key: S3_ENDPOINT

              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  echo "Starting RustFS mirror to Cloudflare R2..."

                  rc alias set local http://rustfs:9000 "$LOCAL_S3_ACCESS_KEY_ID" "$LOCAL_S3_SECRET_ACCESS_KEY"
                  rc alias set backup "$R2_ENDPOINT" "$R2_ACCESS_KEY" "$R2_SECRET_KEY"

                  # rc has no single "mirror the whole alias" command (unlike mc mirror
                  # local/), so each bucket is mirrored explicitly under its own prefix.
                  # No --remove: objects deleted locally are kept in the backup.
                  for bucket in "$LOCAL_S3_BUCKET" "$LOCAL_S3_SITEMAPS_BUCKET" "$LOCAL_S3_IMPORTS_BUCKET"; do
                    rc mirror --overwrite "local/${bucket}/" "backup/${R2_BUCKET}/rustfs-data/${bucket}/"
                  done

                  echo "RustFS mirror to R2 complete."
