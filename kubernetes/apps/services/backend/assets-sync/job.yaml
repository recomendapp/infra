apiVersion: batch/v1
kind: Job
metadata:
  name: assets-sync
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: github-credentials
      containers:
        - name: assets-sync
          image: ghcr.io/recomendapp/assets:b136-0764835
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: rustfs-secret
      restartPolicy: Never
  backoffLimit: 4
