apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: github-credentials
      containers:
      - name: postgres
        image: ghcr.io/recomendapp/postgres:b124-00f6a3a
        # The 4MB work_mem default made REFRESH MATERIALIZED VIEW
        # tmdb.person_feed_view spill a 2.7 GB sort to temp files and take
        # 35 minutes. work_mem stays modest: it applies per sort, per
        # connection.
        args:
          - postgres
          - -c
          - shared_buffers=1GB
          - -c
          - work_mem=32MB
          - -c
          - maintenance_work_mem=512MB
          # postgis and unaccent live in the `extensions` schema and the setup
          # script calls st_makepoint unqualified. A plain pg_dump does not
          # carry ALTER DATABASE ... SET, so the search_path the old cluster
          # had was lost on restore and db-migrator failed with
          # "function st_makepoint(unknown, unknown) does not exist".
          - -c
          - search_path=public,extensions
        envFrom:
          - secretRef:
              name: postgres-secret
        env:
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata
        ports:
          - containerPort: 5432
            name: postgres
        volumeMounts:
          - name: postgres-data
            mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "3584Mi"
            cpu: "250m"
          limits:
            memory: "6Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
      annotations:
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: longhorn
      resources:
        requests:
          storage: 50Gi
