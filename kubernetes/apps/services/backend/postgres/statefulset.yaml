apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: github-credentials
      containers:
      - name: postgres
        image: ghcr.io/recomendapp/postgres:b146-00a5eed
        # The 4MB work_mem default made REFRESH MATERIALIZED VIEW
        # tmdb.person_feed_view spill a 2.7 GB sort to temp files and take
        # 35 minutes. work_mem stays modest: it applies per sort, per
        # connection.
        args:
          - postgres
          - -c
          - shared_buffers=1GB
          - -c
          - work_mem=32MB
          - -c
          - maintenance_work_mem=512MB
          # postgis and unaccent live in the `extensions` schema and the setup
          # script calls st_makepoint unqualified. A plain pg_dump does not
          # carry ALTER DATABASE ... SET, so the search_path the old cluster
          # had was lost on restore and db-migrator failed with
          # "function st_makepoint(unknown, unknown) does not exist".
          - -c
          - search_path=public,extensions
        envFrom:
          - secretRef:
              name: postgres-secret
        env:
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata
        ports:
          - containerPort: 5432
            name: postgres
        volumeMounts:
          - name: postgres-data
            mountPath: /var/lib/postgresql/data
          # Postgres allocates POSIX shared memory here to pass tuples
          # between a parallel query's leader and its workers. A container's
          # /dev/shm defaults to 64Mi, which is not enough: the allocation
          # fails outright rather than degrading, and takes the query with it.
          #
          #   ERROR: could not resize shared memory segment to 16777216 bytes:
          #          No space left on device
          #   FATAL: terminating background worker "parallel worker"
          #
          # `refresh materialized view tmdb.person_feed_view` hit this every
          # day at 16:01 UTC and had not succeeded since 2026-11-02 — the view
          # was serving fourteen-day-old rows. Nothing surfaced it: the failure
          # is inside Postgres, so no pod restarted and no alert fired.
          #
          # This is the sequel to the work_mem tuning in args above. Raising it
          # to 32MB stopped the 2.7GB spill to disk and made the refresh cheap
          # enough that the planner started parallelising it, which is what
          # brought it to this ceiling.
          - name: dshm
            mountPath: /dev/shm
        resources:
          requests:
            memory: "3584Mi"
            cpu: "250m"
          limits:
            memory: "6Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
        # Memory-backed, so it counts against the container's 6Gi limit — but
        # only for what is actually written. Postgres sits at ~1.2Gi today, so
        # the worst case lands near 2.3Gi. 1Gi is the usual figure for Postgres
        # in Kubernetes; the allocation that failed here was 16Mi.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
      annotations:
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: longhorn
      resources:
        requests:
          storage: 50Gi
