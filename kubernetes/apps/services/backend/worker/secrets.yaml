apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: worker-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: worker-secret
    creationPolicy: Owner
  data:
    # Google Play — reads the production track hourly to confirm an Android release is
    # live, since Play has no App Store Connect-style webhook (see the worker's
    # store-release module). Base64 of the service account JSON key.
    - secretKey: GOOGLE_PLAY_RELEASE_READER_B64
      remoteRef:
        key: GOOGLE_PLAY_RELEASE_READER_B64
    - secretKey: ANDROID_PACKAGE_NAME
      remoteRef:
        key: ANDROID_PACKAGE_NAME
