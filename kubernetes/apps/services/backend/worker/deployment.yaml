apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
        - name: github-credentials
      containers:
        - name: worker
          image: ghcr.io/recomendapp/worker:b131-dc0def8
          imagePullPolicy: Always
          ports:
            - containerPort: 9002
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            # --- Base Configuration ---
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: WEB_APP_URL
              value: "https://recomend.app"

            # --- Database Construction (via postgres-secret) ---
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PG_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql://$(PG_USER):$(PG_PASSWORD)@postgres:5432/$(PG_DB)?sslmode=disable"

            # --- Redis (via redis-secret) ---
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD

            # --- Typesense (via typesense-secret) ---
            - name: TYPESENSE_HOST
              value: "typesense"
            - name: TYPESENSE_PORT
              value: "8108"
            - name: TYPESENSE_PROTOCOL
              value: "http"
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: typesense-secret
                  key: TYPESENSE_API_KEY

            # --- Google Play release polling (via worker-secret) ---
            # `optional` so a not-yet-provisioned key leaves the worker running with the
            # poller disabled, instead of holding every rollout in CreateContainerConfigError
            # -- a missing key fails the whole ExternalSecret, so worker-secret may not exist.
            - name: GOOGLE_PLAY_RELEASE_READER_B64
              valueFrom:
                secretKeyRef:
                  name: worker-secret
                  key: GOOGLE_PLAY_RELEASE_READER_B64
                  optional: true
            - name: ANDROID_PACKAGE_NAME
              valueFrom:
                secretKeyRef:
                  name: worker-secret
                  key: ANDROID_PACKAGE_NAME
                  optional: true