apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app-www-redirect-ingress
  annotations:
    external-dns.kubernetes.io/target: eaa1365e-4fbc-4be3-b071-595fc95e7506.cfargotunnel.com
    traefik.ingress.kubernetes.io/redirect-regex: "^https?://(?:www\\.)?recomend.app/(.*)"
    traefik.ingress.kubernetes.io/redirect-replacement: "https://recomend.app/$1"
    traefik.ingress.kubernetes.io/redirect-permanent: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: www.recomend.app
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: web-app # This backend is a placeholder, as the redirect will happen before hitting the service
                port:
                  number: 80
