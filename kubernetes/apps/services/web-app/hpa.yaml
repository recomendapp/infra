apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-app
  minReplicas: 1
  maxReplicas: 4
  # scaleUp takes the minimum recommendation over its window, so a spike
  # shorter than 300s never adds a pod - only sustained load does.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180
  metrics:
  # CPU only. Next.js heap grows with uptime rather than with load - a pod
  # measured 278Mi fresh and 1283Mi after two days on identical traffic - so a
  # memory target scales up on accumulation, never scales back down, and would
  # defeat minReplicas: 1 within days.
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
