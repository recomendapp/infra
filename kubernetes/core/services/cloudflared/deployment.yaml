# Comment ce tenant est joignable depuis internet.
#
# Sur Hetzner le nœud avait une IP publique et le servicelb de k3s prenait
# 80/443 dessus. À la maison il y a un seul port-forward sur l'UDM Pro, et il
# appartient au Traefik du tenant homelab : il n'y a simplement pas de chemin
# entrant disponible. Le tunnel n'est pas une préférence ici, c'est la seule
# option.
#
# Deux répliques parce que cloudflared tient des connexions sortantes
# longues — un pod rescheduled sans voisin couperait toutes les requêtes en vol.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      enableServiceLinks: false
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7
          args:
            - tunnel
            # --config, pas --token : la forme token fait chercher le routage
            # chez Cloudflare et ignorer configmap.yaml. --no-autoupdate est
            # dans le fichier de config.
            - --config
            - /etc/cloudflared/config.yaml
            - run
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: cloudflared-credentials
