# PRÉREQUIS, la seule chose que ce repo ne peut pas créer lui-même.
#
# Dans le dashboard Cloudflare (Zero Trust -> Networks -> Tunnels), créer un
# tunnel et mettre son token dans Infisical sous CLOUDFLARE_TUNNEL_TOKEN.
# C'est tout ce qui se fait à la main : le routage des hostnames est dans
# configmap.yaml ici, et les enregistrements DNS sont le travail d'external-dns.
#
# Le token est le base64 de {"a":AccountTag,"t":TunnelID,"s":TunnelSecret} —
# exactement les trois champs d'un fichier de credentials, sous des clés plus
# courtes. On le templatise donc plutôt que de demander deux fois le même
# secret sous deux formes. Lancer cloudflared avec un fichier de credentials
# plutôt qu'avec --token est ce qui lui fait lire les règles d'ingress LOCALES :
# avec --token il va chercher sa config chez Cloudflare et configmap.yaml est
# ignoré, ce qui remet le routage dans un dashboard au lieu de git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: cloudflared-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        credentials.json: |
          {{- $t := .token | b64dec | fromJson }}
          {"AccountTag":"{{ $t.a }}","TunnelID":"{{ $t.t }}","TunnelSecret":"{{ $t.s }}"}
  data:
    - secretKey: token
      remoteRef:
        key: CLOUDFLARE_TUNNEL_TOKEN
