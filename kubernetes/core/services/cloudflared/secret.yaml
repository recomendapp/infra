# PREREQUISITE: create the tunnel in the Cloudflare dashboard and put its
# token in Infisical as CLOUDFLARE_TUNNEL_TOKEN. That is the only manual step.
#
# The token is base64 of {"a":AccountTag,"t":TunnelID,"s":TunnelSecret} — the
# three fields a credentials file needs, under shorter keys, so it is
# templated rather than stored twice. Running cloudflared with a credentials
# file instead of --token is what makes it read the LOCAL ingress rules: with
# --token it fetches its config from Cloudflare and configmap.yaml is ignored.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: cloudflared-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        credentials.json: |
          {{- $t := .token | b64dec | fromJson }}
          {"AccountTag":"{{ $t.a }}","TunnelID":"{{ $t.t }}","TunnelSecret":"{{ $t.s }}"}
  data:
    - secretKey: token
      remoteRef:
        key: CLOUDFLARE_TUNNEL_TOKEN
