apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 41.6.1
    releaseName: traefik
    namespace: traefik
    valuesInline:
      # service.spec.type, not service.type: the chart passes `service.spec`
      # straight through and ignores anything else, so the short spelling is
      # accepted and silently does nothing.
      service:
        spec:
          type: ClusterIP

      providers:
        kubernetesIngress:
          # A ClusterIP Service has no status.loadBalancer.ingress to copy,
          # so publishedService leaves every Ingress with an empty status,
          # which ArgoCD reads as Progressing forever.
          publishedService:
            enabled: false
          ingressEndpoint:
            hostname: traefik.traefik.svc.cluster.local

      ingressClass:
        enabled: true
        isDefaultClass: true

      # Without this, Traefik rewrites X-Forwarded-Proto from the scheme of the
      # connection it received. TLS terminates at Cloudflare and cloudflared
      # then speaks plain HTTP to this Service, so every backend was told the
      # request arrived over http even when it did not.
      #
      # Martin is where that surfaced. It builds the TileJSON `tiles` URL from
      # the request, so it advertised http://martin.recomend.app/{z}/{x}/{y} to
      # a page served over HTTPS and the browser blocked every tile as mixed
      # content. Measured on the live pods: Martin returns https when the header
      # reaches it, http when it does not, and the header does not survive
      # Traefik without this setting.
      #
      # The whole pod CIDR rather than cloudflared's pod IPs, which change on
      # every restart. The exposure is that any pod in this vcluster could spoof
      # X-Forwarded-*; acceptable because the Service is ClusterIP, so nothing
      # outside the cluster can reach the entrypoint at all.
      ports:
        web:
          forwardedHeaders:
            trustedIPs:
              - 10.244.0.0/16
