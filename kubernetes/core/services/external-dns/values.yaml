# CNAME, not A: traffic arrives through the Cloudflare tunnel, and each
# Ingress names it in an `external-dns.kubernetes.io/target` annotation. Note
# the prefix: NOT `external-dns.alpha.kubernetes.io/`, which v0.23 no longer
# reads by default and ignores silently.
provider: cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: api-token

sources:
  - ingress

extraArgs:
  # A cfargotunnel.com CNAME is only reachable proxied.
  - --cloudflare-proxied
  # A is listed only while the old cluster's A records still stand:
  # Cloudflare refuses a CNAME on a name that already has an A. Remove it
  # once they are gone.
  - --managed-record-types=A
  - --managed-record-types=CNAME
  - --managed-record-types=TXT

policy: sync
registry: txt
# SAME owner as the Hetzner cluster's external-dns, deliberately: with a
# different txtOwnerId this one would treat the existing records as somebody
# else's and, under policy sync, leave them alone — the CNAMEs would never be
# created. Only safe because that cluster is powered off; both running would
# fight every minute.
txtOwnerId: "k8s"
interval: "1m"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
