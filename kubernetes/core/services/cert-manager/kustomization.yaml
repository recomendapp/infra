apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.19.1
    releaseName: cert-manager
    namespace: cert-manager
    includeCRDs: true
    valuesInline:
      crds:
        enabled: true
      # A Helm post-install hook. Kustomize renders hooks as ordinary
      # resources, so it would re-run on every sync and leave the Job
      # behind; it only ever validated a fresh install's webhook.
      startupapicheck:
        enabled: false
