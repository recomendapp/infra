name: Build Runner Image (Android)

on:
  push:
    branches:
      - main
    paths:
      - 'runner-images/android/**'
      - '.github/workflows/build-runner-image-android.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    name: 🐳 Build & Push Android Runner Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Generate Tag
        id: prep
        run: echo "TAG=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 🏗️ Build & Push
        uses: docker/build-push-action@v6
        with:
          context: runner-images/android
          push: true
          tags: |
            ghcr.io/recomendapp/runner-android:${{ steps.prep.outputs.TAG }}
            ghcr.io/recomendapp/runner-android:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📝 Bump Image Tag in values.yaml
        env:
          TAG: ${{ steps.prep.outputs.TAG }}
        run: |
          FILE=cluster/services/actions-runner-scale-set-android/values.yaml
          sed -i "s|image: ghcr.io/recomendapp/runner-android:.*|image: ghcr.io/recomendapp/runner-android:${TAG}|" "$FILE"

      - name: 🚀 Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cluster/services/actions-runner-scale-set-android/values.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "deploy: update android runner image to ${{ steps.prep.outputs.TAG }}"
            git push origin main
          fi
